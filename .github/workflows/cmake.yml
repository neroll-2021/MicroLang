name: CMake on multiple platforms

on:
  push:
    branches: [ "dev" ]
    paths:
      - ".github/workflows/cmake.yml"
      - "include/**"
      - "src/**"
      - "CMakeLists.txt"
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        build_type: [Release, Debug]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-2025
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-2025
            c_compiler: gcc
          - os: windows-2025
            c_compiler: clang
          - os: ubuntu-24.04
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Download LLVM (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $LLVM_VERSION = "20.1.8"
        $LLVM_URL = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
        Invoke-WebRequest $LLVM_URL -OutFile llvm.tar.xz

    - name: Extract LLVM (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        tar -xf llvm.tar.xz
        Move-Item clang+llvm-* llvm

    - name: Add LLVM to PATH (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $llvmPath = (Get-Item "$PWD\llvm\bin").FullName
        Write-Host "Adding LLVM to PATH: $llvmPath"
        [System.Environment]::SetEnvironmentVariable("PATH", $env:PATH + ";$llvmPath", [System.EnvironmentVariableTarget]::Process)

    - name: Setup dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y gcc-14 g++-14 libstdc++-14-dev libffi-dev libedit-dev libcurl4-openssl-dev
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
        sudo update-alternatives --set gcc /usr/bin/gcc-14
        sudo update-alternatives --set g++ /usr/bin/g++-14
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21 all
        sudo apt install -y cmake ninja-build

    - name: Build micc
      shell: bash
      run: |
        cmake -B build -S . -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}

        cmake --build build

    - name: Run
      shell: bash
      run: |
        cd build
        ./micc
